name: Feature request
description: Propose a broadly useful exporter improvement.
title: '[Feature]: '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Explain the workflow and why the current behavior is insufficient.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: Query-safety constraints
      options:
        - label: The proposal can remain browser-local with no external rendering service.
          required: true
        - label: The proposal does not require deliberate datasource refreshes or query interception.
          required: true
