# This GitHub Action automates the process of building Grafana plugins.
# (For more information, see https://github.com/grafana/plugin-actions/blob/main/build-plugin/README.md)
name: Release

on:
  push:
    tags:
      - 'v*' # Run workflow on version tags, e.g. v1.0.0.

permissions: read-all

jobs:
  release:
    permissions:
      id-token: write
      contents: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Require public signing configuration
        shell: bash
        env:
          PUBLIC_SIGNING_ENABLED: ${{ vars.GRAFANA_PUBLIC_SIGNING_ENABLED }}
          SIGNING_TOKEN: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
        run: |
          if [[ "$PUBLIC_SIGNING_ENABLED" != "true" || -z "$SIGNING_TOKEN" ]]; then
            echo "Community release requires enabled public signing and a configured signing token."
            exit 1
          fi

      - uses: grafana/plugin-actions/build-plugin@build-plugin/v1.2.0
        with:
          node-version: '24'
          # Grafana has approved this plugin for public Community signing.
          policy_token: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
          attestation: true
